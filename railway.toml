[build]
builder = "nixpacks"
installCommand = "npm install -g pnpm && pnpm install --no-frozen-lockfile"
buildCommand = "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/db run db:push"

[deploy]
startCommand = "pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/stats"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
